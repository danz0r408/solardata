<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarData</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 01 · Splash (referência: referencias/01-splash.jpeg) -->
  <main class="screen splash">
    <div class="splash__rings" aria-hidden="true"></div>

    <div class="splash__center">
      <div class="splash__icon">
        <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
          <g stroke="#f0a51a" stroke-width="3" stroke-linecap="round">
            <line x1="32" y1="6" x2="32" y2="11"/>
            <line x1="23" y1="8.5" x2="25" y2="13"/>
            <line x1="41" y1="8.5" x2="39" y2="13"/>
            <line x1="16" y1="14" x2="19.5" y2="17.5"/>
            <line x1="48" y1="14" x2="44.5" y2="17.5"/>
            <line x1="11" y1="22" x2="16" y2="24"/>
            <line x1="53" y1="22" x2="48" y2="24"/>
          </g>
          <circle cx="32" cy="29" r="10" fill="#f0a51a"/>
          <g fill="#fff">
            <rect x="14" y="34" width="7" height="14" rx="2"/>
            <rect x="24" y="30" width="7" height="18" rx="2"/>
            <rect x="34" y="27" width="7" height="21" rx="2"/>
            <rect x="44" y="31" width="7" height="17" rx="2"/>
          </g>
          <rect x="13" y="51" width="38" height="2.5" rx="1.25" fill="#8b9298"/>
        </svg>
      </div>

      <h1 class="wordmark">Solar<span>Data</span></h1>
      <p class="splash__slogan">Dados que iluminam novas oportunidades.</p>
    </div>

    <div class="splash__loading" role="status">
      <div class="progress" aria-hidden="true"><span></span></div>
      Carregando dados da ANEEL e do IBGE…
    </div>
  </main>
</body>
</html>
