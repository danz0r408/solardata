<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · SolarData</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 02 · Login (referência: referencias/02-login.jpeg) -->
  <main class="screen">
    <div class="auth__halo" aria-hidden="true"></div>

    <div class="brand-row">
      <div class="app-icon">
        <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true">
          <g stroke="#f0a51a" stroke-width="3" stroke-linecap="round">
            <line x1="32" y1="6" x2="32" y2="11"/>
            <line x1="23" y1="8.5" x2="25" y2="13"/>
            <line x1="41" y1="8.5" x2="39" y2="13"/>
            <line x1="16" y1="14" x2="19.5" y2="17.5"/>
            <line x1="48" y1="14" x2="44.5" y2="17.5"/>
            <line x1="11" y1="22" x2="16" y2="24"/>
            <line x1="53" y1="22" x2="48" y2="24"/>
          </g>
          <circle cx="32" cy="29" r="10" fill="#f0a51a"/>
          <g fill="#fff">
            <rect x="14" y="34" width="7" height="14" rx="2"/>
            <rect x="24" y="30" width="7" height="18" rx="2"/>
            <rect x="34" y="27" width="7" height="21" rx="2"/>
            <rect x="44" y="31" width="7" height="17" rx="2"/>
          </g>
          <rect x="13" y="51" width="38" height="2.5" rx="1.25" fill="#8b9298"/>
        </svg>
      </div>
      <p class="wordmark">Solar<span>Data</span></p>
    </div>

    <header class="auth__header">
      <h1 class="auth__title">Bem-vindo de volta</h1>
      <p class="auth__lead">Acesse sua conta para consultar os indicadores de geração solar.</p>
    </header>

    <form class="form" novalidate>
      <div class="field">
        <label for="login-email">E-mail</label>
        <div class="field__control">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="login-email" type="email" name="email" placeholder="voce@empresa.com.br" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label for="login-senha">Senha</label>
        <div class="field__control">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="login-senha" type="password" name="senha" placeholder="Sua senha" autocomplete="current-password">
          <button class="field__toggle" type="button" aria-label="Mostrar senha">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <p class="form__aside"><a class="text-link" href="#">Esqueci minha senha</a></p>

      <a class="button" href="04-dashboard.html">Entrar</a>
    </form>

    <p class="auth__footer">Ainda não tem conta? <a class="text-link" href="03-cadastro.html">Cadastre-se</a></p>
  </main>
</body>
</html>
