<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · SolarData</title>
  <meta name="theme-color" content="#f8fbfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11191c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="js/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Tela 2: Login -->
  <main class="screen">
    <p class="brand">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true">
        <g stroke="oklch(76% 0.155 72)" stroke-width="3" stroke-linecap="round">
          <line x1="32" y1="6" x2="32" y2="11"/>
          <line x1="16" y1="14" x2="19.5" y2="17.5"/>
          <line x1="48" y1="14" x2="44.5" y2="17.5"/>
          <line x1="10" y1="27" x2="15" y2="27"/>
          <line x1="54" y1="27" x2="49" y2="27"/>
        </g>
        <circle cx="32" cy="29" r="10" fill="oklch(76% 0.155 72)"/>
        <g fill="currentColor">
          <rect x="14" y="36" width="7" height="14" rx="1.5"/>
          <rect x="24" y="31" width="7" height="19" rx="1.5"/>
          <rect x="34" y="27" width="7" height="23" rx="1.5"/>
          <rect x="44" y="32" width="7" height="18" rx="1.5"/>
        </g>
      </svg>
      SolarData
    </p>

    <h1 class="auth__title">Entrar na sua conta</h1>

    <form class="form" id="form-login" novalidate>
      <div class="field">
        <label for="login-email">E-mail</label>
        <div class="field__control">
          <input id="login-email" type="email" name="email" required placeholder="voce@empresa.com.br" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label for="login-senha">Senha</label>
        <div class="field__control">
          <input id="login-senha" type="password" name="senha" required autocomplete="current-password">
          <button class="field__toggle" type="button">Mostrar</button>
        </div>
      </div>

      <p class="form__aside"><a class="text-link" href="#" id="esqueci">Esqueci minha senha</a></p>
      <p class="form__notice" id="esqueci-aviso" role="status" hidden>Recuperação por e-mail em breve. Fale com o administrador do SolarData.</p>

      <p class="form__error" id="login-erro" role="alert"></p>

      <button class="button" type="submit">Entrar</button>
    </form>

    <p class="auth__footer">Não tem conta? <a class="text-link" href="cadastro.html">Cadastre-se</a></p>
  </main>
  <script src="js/comum.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
