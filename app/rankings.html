<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rankings · SolarData</title>
  <meta name="theme-color" content="#f8fbfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11191c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="js/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Tela 6: Rankings de municípios. Dados da API. -->
  <main class="screen app">
    <header class="topbar">
      <h1 class="page-title">Rankings</h1>
    </header>

    <div class="filters">
      <label class="visually-hidden" for="rk-estado">Estado</label>
      <select id="rk-estado" name="estado"><option value="">Todos os estados</option></select>
      <label class="visually-hidden" for="rk-porte">Porte do município</label>
      <select id="rk-porte" name="porte">
        <option value="100000">Acima de 100 mil hab.</option>
        <option value="50000" selected>Acima de 50 mil hab.</option>
        <option value="20000">Acima de 20 mil hab.</option>
        <option value="0">Todos os portes</option>
      </select>
    </div>
    <p class="notice" id="erro" role="alert" hidden></p>

    <!-- Ranking por oportunidade (IPNE): o diferencial do SolarData -->
    <section class="section" id="oportunidade" aria-labelledby="oportunidade-titulo">
      <div class="section__head">
        <h2 class="section__title" id="oportunidade-titulo">Maior oportunidade</h2>
        <span class="meta">Score de oportunidade</span>
      </div>
      <ol id="lista-oportunidade" aria-busy="true"></ol>
      <button class="more" type="button" id="mais-oportunidade" hidden>Ver mais</button>
    </section>

    <!-- Ranking por adoção atual -->
    <section class="section" id="adocao" aria-labelledby="adocao-titulo">
      <div class="section__head">
        <h2 class="section__title" id="adocao-titulo">Maior adoção</h2>
        <span class="meta">Instalações</span>
      </div>
      <ol id="lista-adocao" aria-busy="true"></ol>
      <button class="more" type="button" id="mais-adocao" hidden>Ver mais</button>
    </section>

    <p class="footnote" id="rodape-rankings"></p>
  </main>

  <nav class="tabbar" aria-label="Navegação principal">
    <ul>
      <li><a href="inicio.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a></li>
      <li><a href="indicadores.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Explorar</a></li>
      <li><a href="rankings.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Rankings</a></li>
      <li><a href="perfil.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</a></li>
    </ul>
  </nav>
  <script src="js/comum.js"></script>
  <script src="js/rankings.js"></script>
</body>
</html>
